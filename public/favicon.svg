<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Search / Radar Rings -->
  <circle cx="236" cy="236" r="140" stroke="url(#primaryGrad)" stroke-width="8" stroke-dasharray="12 12" stroke-opacity="0.4"/>
  <circle cx="236" cy="236" r="110" stroke="url(#primaryGrad)" stroke-width="18" fill="none" filter="url(#glow)" opacity="0.9"/>
  <circle cx="236" cy="236" r="110" stroke="url(#primaryGrad)" stroke-width="18" fill="none"/>

  <!-- Magnifying Handle / Dynamic Vector Beam -->
  <path d="M318 318L414 414" stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M318 318L414 414" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- SEO Analytics Ascending Wave Bars inside Lens -->
  <path d="M165 270L165 240" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M195 270L195 210" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M225 270L225 180" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M255 270L255 195" stroke="url(#sparkleGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M285 270L285 160" stroke="url(#sparkleGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Growth Trendline through Lens -->
  <path d="M150 250Q 210 230 240 180 T 310 140" stroke="url(#sparkleGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Central / Top AI Sparkle Star (4-point AI Icon) -->
  <g transform="translate(340, 110)">
    <path d="M0 -45C0 -10 10 0 45 0C10 0 0 10 0 45C0 10 -10 0 -45 0C-10 0 0 -10 0 -45Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Small AI Satellite Sparkle -->
  <g transform="translate(130, 130)">
    <path d="M0 -22C0 -5 5 0 22 0C5 0 0 5 0 22C0 5 -5 0 -22 0C-5 0 0 -5 0 -22Z" fill="url(#accentGrad)" opacity="0.85"/>
  </g>
  <g transform="translate(390, 260)">
    <path d="M0 -16C0 -4 4 0 16 0C4 0 0 4 0 16C0 4 -4 0 -16 0C-4 0 0 -4 0 -16Z" fill="#38bdf8" opacity="0.75"/>
  </g>
</svg>
