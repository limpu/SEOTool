<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" rx="20" fill="url(#bgGrad)"/>
  <rect width="1276" height="636" x="2" y="2" rx="18" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Cyber Grid Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#6366f1" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="1080" cy="460" r="200" fill="#06b6d4" opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="640" cy="100" r="120" fill="#a855f7" opacity="0.12" filter="url(#softGlow)"/>

  <!-- TOP BADGE: OPEN SOURCE ENTERPRISE SUITE -->
  <g transform="translate(100, 72)">
    <rect width="360" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#badgeGlow)"/>
    <text x="36" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">OPEN-SOURCE AI SEO PLATFORM</text>
  </g>

  <!-- HERO TITLE & TAGLINE -->
  <text x="100" y="175" fill="url(#neonCyanPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">SEOTool</text>
  <text x="390" y="175" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">Intelligence</text>

  <text x="100" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
    Zero-Paid-API Autonomous SEO Crawler, AI Engine Optimization (AEO) &amp; Deep Auditing Suite
  </text>

  <!-- PILL TAGS -->
  <g transform="translate(100, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">⚡ Next.js 16</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">🧠 Ollama AI Engine</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(299, 0)">
      <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">🐘 PostgreSQL 18</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(456, 0)">
      <rect width="135" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="700">🔒 100% Private</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(603, 0)">
      <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">📊 Lighthouse CWV</text>
    </g>
  </g>

  <!-- 3 FEATURE DISPLAY CARDS -->
  <!-- Card 1: Autonomous Crawler -->
  <g transform="translate(100, 320)">
    <rect width="330" height="210" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="44" height="44" x="20" y="20" rx="10" fill="#0284c7" fill-opacity="0.2"/>
    <!-- Spider/Globe Icon -->
    <path d="M42 32A10 10 0 1 0 42 52A10 10 0 1 0 42 32M32 42H52M42 32C39 36 39 48 42 52M42 32C45 36 45 48 42 52" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="76" y="47" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Deep Crawler</text>
    <text x="20" y="94" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Multi-threaded autonomous engine.
    </text>
    <text x="20" y="114" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Audits status codes, canonicals,
    </text>
    <text x="20" y="134" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      sitemaps, robots.txt, schema &amp; links.
    </text>
    <line x1="20" y1="160" x2="310" y2="160" stroke="#334155"/>
    <text x="20" y="188" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">90+ Technical SEO Rules →</text>
  </g>

  <!-- Card 2: AI Search & AEO Intelligence -->
  <g transform="translate(460, 320)">
    <rect width="330" height="210" rx="14" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect width="44" height="44" x="20" y="20" rx="10" fill="#6366f1" fill-opacity="0.2"/>
    <!-- AI Sparkle Icon -->
    <path d="M42 28L44 38L54 40L44 42L42 52L40 42L30 40L40 38Z" fill="#a78bfa"/>
    <text x="76" y="47" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">AI Search &amp; AEO</text>
    <text x="20" y="94" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Optimized for ChatGPT, Perplexity,
    </text>
    <text x="20" y="114" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Google SGE, and Claude Bot crawls.
    </text>
    <text x="20" y="134" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Local LLM answerability scoring.
    </text>
    <line x1="20" y1="160" x2="310" y2="160" stroke="#334155"/>
    <text x="20" y="188" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="700">Zero API Token Costs →</text>
  </g>

  <!-- Card 3: E-E-A-T & Google Intelligence -->
  <g transform="translate(820, 320)">
    <rect width="360" height="210" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect width="44" height="44" x="20" y="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <!-- Shield / Check Icon -->
    <path d="M42 28L52 32V42C52 48 48 53 42 56C36 53 32 48 32 42V32L42 28Z" stroke="#34d399" stroke-width="2" fill="none"/>
    <text x="76" y="47" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">E-E-A-T &amp; Trust</text>
    <text x="20" y="94" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Experience, Expertise, Authority audit.
    </text>
    <text x="20" y="114" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      Native Google Search Console (GSC)
    </text>
    <text x="20" y="134" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="400">
      &amp; GA4 sync via encrypted OAuth.
    </text>
    <line x1="20" y1="160" x2="340" y2="160" stroke="#334155"/>
    <text x="20" y="188" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Actionable Trust Benchmarks →</text>
  </g>

  <!-- FOOTER: DEVELOPED BY ATIQUE ULLAH -->
  <g transform="translate(100, 580)">
    <text x="0" y="16" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="500">
      Developed by <tspan fill="#38bdf8" font-weight="700">Atique Ullah</tspan> • Open Source at <tspan fill="#e2e8f0" font-weight="600">github.com/limpu/SEOTool</tspan>
    </text>
    <text x="1080" y="16" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="end">
      MIT Licensed • Production Ready
    </text>
  </g>
</svg>
