<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="500" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="40" y="48" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="800">SEOTool Architectural Topology</text>
  <text x="40" y="74" fill="#94a3b8" font-family="sans-serif" font-size="13">High-throughput autonomous crawling, zero-paid-API local intelligence &amp; multi-tenant RBAC pipeline</text>

  <!-- Step 1: Input & Targets -->
  <g transform="translate(40, 110)">
    <rect width="200" height="340" rx="12" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="36" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">1. DISCOVERY &amp; INGEST</text>
    
    <rect width="160" height="48" x="20" y="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Web Crawling Engine</text>

    <rect width="160" height="48" x="20" y="115" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Sitemaps &amp; Robots.txt</text>

    <rect width="160" height="48" x="20" y="175" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="204" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Google Search Console</text>

    <rect width="160" height="48" x="20" y="235" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="264" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Google Analytics 4</text>
  </g>

  <!-- Connector Line 1 -> 2 -->
  <path d="M240 280 L 290 280" stroke="url(#wire)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Step 2: Analysis & Intelligence Core -->
  <g transform="translate(290, 110)">
    <rect width="250" height="340" rx="12" fill="url(#boxBg)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="36" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="700">2. AUDIT &amp; HEURISTICS</text>

    <rect width="210" height="48" x="20" y="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">90+ Technical SEO Rules</text>

    <rect width="210" height="48" x="20" y="115" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">E-E-A-T Trust Scorer</text>

    <rect width="210" height="48" x="20" y="175" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="204" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Headless Lighthouse (CWV)</text>

    <rect width="210" height="48" x="20" y="235" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="264" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Competitor Gap Matrix</text>
  </g>

  <!-- Connector Line 2 -> 3 -->
  <path d="M540 280 L 590 280" stroke="url(#wire)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Step 3: Local AI & Ollama -->
  <g transform="translate(590, 110)">
    <rect width="220" height="340" rx="12" fill="url(#boxBg)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="20" y="36" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700">3. LOCAL AI (ZERO COST)</text>

    <rect width="180" height="60" x="20" y="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Ollama Local LLM</text>
    <text x="30" y="100" fill="#94a3b8" font-family="sans-serif" font-size="10">Llama 3 / Mistral / DeepSeek</text>

    <rect width="180" height="60" x="20" y="130" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">AEO Assessment</text>
    <text x="30" y="175" fill="#94a3b8" font-family="sans-serif" font-size="10">Answer Engine Readability</text>

    <rect width="180" height="60" x="20" y="205" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Semantic Gap Analysis</text>
    <text x="30" y="250" fill="#94a3b8" font-family="sans-serif" font-size="10">Topical completeness check</text>
  </g>

  <!-- Connector Line 3 -> 4 -->
  <path d="M810 280 L 860 280" stroke="url(#wire)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Step 4: Storage & Delivery -->
  <g transform="translate(860, 110)">
    <rect width="200" height="340" rx="12" fill="url(#boxBg)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="36" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">4. PERSISTENCE &amp; UI</text>

    <rect width="160" height="48" x="20" y="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="84" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">PostgreSQL 18</text>

    <rect width="160" height="48" x="20" y="115" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Drizzle ORM</text>

    <rect width="160" height="48" x="20" y="175" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="204" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Enterprise RBAC</text>

    <rect width="160" height="48" x="20" y="235" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="32" y="264" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">PDF / CSV Reports</text>
  </g>
</svg>
